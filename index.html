<title>Victoria Island Spawns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: fold-out field guide on the left (Monsters / Drops), the world map fills the rest; tooltips follow hovered nodes */
:root{ /* Catppuccin Mocha, single dark theme */
  --bg:#11111b; --panel:#1e1e2e; --panel2:#313244; --ink:#cdd6f4; --muted:#a6adc8; --line:#45475a;
  --accent:#cba6f7; --accent-ink:#11111b; --blue:#89b4fa; --hit:#f9e2af; --hit-ink:#11111b; --hit-soft:rgba(249,226,175,.14);
  --t1:#a6e3a1; --t2:#f9e2af; --t3:#fab387; --t4:#f38ba8; --chip-ink:#11111b;
  --node-hover:rgba(205,214,244,.3); --shadow:rgba(0,0,0,.45);
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);padding:16px;box-sizing:border-box}
*{box-sizing:border-box}
/* both panel columns stay reserved whether open or folded, so the map keeps its size; the map column takes the rest of the window */
.app{display:grid;grid-template-columns:330px minmax(0,1fr) 290px;gap:16px;align-items:start}
/* sidebar */
.side{grid-column:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  display:flex;flex-direction:column;max-height:calc(100vh - 32px);position:sticky;top:16px;overflow:hidden}
.side[data-closed="true"]{display:none}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 0 14px}
.side-head h2{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:0}
.lk{position:absolute;top:1px;left:1px;z-index:1;width:22px;height:22px;display:grid;place-items:center;padding:0;border:0;border-radius:6px;
  background:none;color:var(--muted);opacity:0;cursor:pointer;transition:opacity .12s,color .12s,transform .1s}
.row:hover .lk,.rank-list li:hover .lk,.row:focus-within .lk,.rank-list li:focus-within .lk{opacity:.55}
.lk:hover{opacity:1!important;color:var(--accent)}
.lk:active{transform:scale(.85)}
.lk:focus{outline:none}.lk:focus-visible{opacity:1;outline:2px solid var(--accent);outline-offset:-2px}
.lk .sh-closed{display:none}
.lk[aria-pressed="true"]{opacity:1;color:var(--accent)}
.lk[aria-pressed="true"] .sh-open{display:none}.lk[aria-pressed="true"] .sh-closed{display:inline}
.lk[aria-pressed="true"] svg{filter:drop-shadow(0 0 3px rgba(203,166,247,.55))}
@media (hover:none){.lk{opacity:.4}}
.row,.rank-list li{position:relative}
.rk-name{display:flex;align-items:flex-start;gap:4px}
.rk-name .lk{position:static;flex:none;width:18px;height:18px;margin:1px 0 0 -2px;opacity:.35}
.rank-list li:hover .rk-name .lk{opacity:.7}
.rk-who{padding-left:20px}
.locating .pics{display:inline-flex;gap:2px;align-items:center}
.icon-btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:8px;width:30px;height:30px;
  display:grid;place-items:center;cursor:pointer;font:700 15px var(--body)}
.icon-btn:focus-visible,.btn:focus-visible,.tab:focus-visible,input:focus-visible,.chip-f:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tabs{display:flex;gap:4px;padding:10px 12px 0}
.tab{flex:1;border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:8px 8px 0 0;border-bottom:0;
  padding:7px 0;font:700 .85rem var(--body);cursor:pointer}
.tab[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:inset 0 3px 0 var(--accent)}
.tools{padding:10px 12px;border-top:1px solid var(--line);display:grid;gap:8px}
.tools input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--ink);font:600 .9rem var(--body)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip-f{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:2px 10px;font:700 .75rem var(--body);cursor:pointer}
.chip-f[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.list{overflow-y:auto;padding:0 6px 10px;min-height:0}
.row{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;padding:6px;border-radius:8px;cursor:pointer}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.web{display:grid;place-items:center;width:26px;height:26px;border-radius:7px;color:var(--muted);text-decoration:none}
.web:hover,.web:focus-visible{background:var(--line);color:var(--blue);outline:none}
.row:hover{background:var(--panel2)}
.row.on{background:var(--hit-soft);box-shadow:inset 0 0 0 1px var(--hit)}
.row .txt{min-width:0}
.row .nm{font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sm{font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:4px}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:7px;padding:4px 8px;font:700 .72rem var(--body);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.loc[aria-pressed="true"]{background:var(--hit);border-color:var(--hit);color:var(--hit-ink)}
.empty-l{padding:16px;color:var(--muted);font-size:.85rem}
/* sprites & icons from atlases */

.cell{width:40px;height:40px;display:grid;place-items:center}
/* map */
.main{grid-column:2;min-width:0;display:grid;gap:10px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
h1{font-family:var(--display);font-weight:600;font-size:1.5rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.85rem}
.open-side{display:none}
.side[data-closed="true"] ~ .main .open-side{display:inline-grid}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.bar .lbl{font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.bar .sep{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 4px 2px 6px;font-weight:700;font-size:.8rem;
  background:var(--hit-soft);border:1px solid var(--hit);cursor:default;min-height:28px}
.pill.spot{background:rgba(203,166,247,.12);border-color:var(--accent);cursor:pointer}
.pill .x,.pill .plk{border:0;background:none;color:var(--muted);cursor:pointer;width:20px;height:20px;display:grid;place-items:center;border-radius:50%;padding:0;font:800 .9rem/1 var(--body)}
.pill .x:hover{color:var(--ink);background:var(--line)}
.pill .plk:hover{color:var(--accent)}
.pill .plk[aria-pressed="true"]{color:var(--accent)}
.pill .plk .sh-closed{display:none}.pill .plk[aria-pressed="true"] .sh-open{display:none}.pill .plk[aria-pressed="true"] .sh-closed{display:inline}
.pill .x:focus{outline:none}.pill .x:focus-visible,.pill .plk:focus-visible{outline:2px solid var(--accent)}
.pill .count{color:var(--muted);font-weight:700}
.bar .clear{border:0;background:none;color:var(--muted);font:700 .75rem var(--body);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.node.saved{border-color:#fff;background:rgba(203,166,247,.75);box-shadow:0 0 0 3px var(--accent),0 0 16px 6px rgba(203,166,247,.75)}
.map.loc .node.saved{opacity:1}
.map.loc .node.hit.saved{outline:3px solid var(--accent);outline-offset:3px}

.node{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:2px solid transparent;
  background:transparent;cursor:pointer;transition:transform .12s,border-color .12s,background .12s,opacity .2s}
.node.town,.node.cluster{width:26px;height:26px;margin:-13px 0 0 -13px}
.node{padding:0;font:inherit;color:inherit}
/* "+N" chip on a lit node: how many matching hidden maps its fold-out holds */
.map.loc .node.hit[data-more]::before{content:"+" attr(data-more);position:absolute;bottom:calc(100% - 6px);left:calc(100% - 6px);padding:0 5px;
  border-radius:999px;background:var(--hit);color:var(--hit-ink);font:800 .62rem/15px var(--body);white-space:nowrap;pointer-events:none;box-shadow:0 1px 4px var(--shadow)}
/* door badge: this map has hidden maps behind it */
.node .door{position:absolute;right:-8px;bottom:-8px;width:15px;height:15px;display:grid;place-items:center;border-radius:4px;
  background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:0 1px 3px var(--shadow);pointer-events:none}
.node.open{border-color:var(--accent);background:rgba(203,166,247,.35);box-shadow:0 0 0 3px var(--accent);opacity:1!important}
/* fold-out: the selected map's hidden maps, rolled up above its node */
.fold{position:absolute;z-index:6;width:min(290px,90%);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;box-shadow:0 14px 34px var(--shadow);transform-origin:var(--cx,50%) 100%;animation:rollout .24s cubic-bezier(.2,.9,.25,1)}
.fold.below{transform-origin:var(--cx,50%) 0}
.fold::after{content:"";position:absolute;left:var(--cx,50%);bottom:-7px;width:12px;height:12px;margin-left:-6px;background:var(--panel);
  border:1px solid var(--line);border-top:0;border-left:0;transform:rotate(45deg)}
.fold.below::after{bottom:auto;top:-7px;transform:rotate(-135deg)}
@keyframes rollout{from{opacity:0;transform:translateY(10px) scale(.94,.4)}to{opacity:1;transform:none}}
.fold.below{animation-name:rolldown}
@keyframes rolldown{from{opacity:0;transform:translateY(-10px) scale(.94,.4)}to{opacity:1;transform:none}}
.fold-head{display:flex;align-items:center;gap:8px;padding:10px 8px 9px 12px;border-bottom:1px solid var(--line)}
.fold-head h3{flex:1;min-width:0;margin:0;font-family:var(--display);font-weight:600;font-size:1rem;line-height:1.2;text-wrap:balance}
.fold-head h3 small{display:block;font:700 .72rem var(--body);color:var(--muted)}
.go{display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);text-decoration:none}
.go:hover{filter:brightness(1.08)}
.go:focus-visible,.fold .x:focus-visible,.fold .grow:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.tip .hint{margin:6px 0 0;font-size:.72rem;font-weight:700;color:var(--accent)}
/* pinned tooltip of the selected map: web button, clickable monsters */
.tip-head{display:flex;align-items:center;gap:8px}
/* minimap: sized up front so the tooltip is placed before the image loads; dots are the selected monsters' spawn points */
.mini{position:relative;margin:2px auto 8px;border-radius:6px;overflow:hidden;background:var(--panel2)}
.mini img{display:block;width:100%;height:100%}
.mini i{position:absolute;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:var(--hit);box-shadow:0 0 0 1.5px var(--hit-ink)}
.tip-head h3{flex:1;min-width:0}
.tip.held{pointer-events:auto;border-color:var(--accent)}
.tip.held tbody tr{cursor:pointer}
.tip.held tbody tr:hover td{background:var(--panel2)}
.tip.held tbody tr:hover td:first-child{border-radius:6px 0 0 6px}.tip.held tbody tr:hover td:last-child{border-radius:0 6px 6px 0}
.fold .x,.fold .grow{flex:none;width:26px;height:26px;border:0;border-radius:7px;background:none;color:var(--muted);font:800 1rem/1 var(--body);cursor:pointer}
.fold .x:hover,.fold .grow:hover{background:var(--panel2);color:var(--ink)}
/* expanded: full map height, rows flow into columns, no caret */
.fold.big{width:min(600px,calc(100% - 16px))}
.fold.big::after{display:none}
.fold.big .fold-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));align-content:start;gap:2px 6px}
.fold-list{list-style:none;margin:0;padding:4px 6px 6px;overflow-y:auto;min-height:0}
.fold-list>li{border-radius:8px}
.fold-list>li.hl{background:var(--hit-soft)}
.fold-list>li.pick{background:rgba(203,166,247,.22);box-shadow:inset 0 0 0 1px var(--accent)}
.fold-list>li.dim>.fh{opacity:.5}
.fh{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:8px;cursor:pointer;outline:none}
.fh:hover,.fh:focus-visible{background:var(--panel2)}
.fold-list>li.hl .fh:hover{background:rgba(249,226,175,.24)}
.fold-list .nm{flex:1;min-width:0;font-weight:700;font-size:.84rem;line-height:1.25}
.fold-list .nm small{display:block;font-size:.7rem;color:var(--muted)}
.fold-list .ind{color:var(--muted);flex:none}
.fold-list .ct{font:600 .95rem var(--display);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.fold{animation:none}}
.node:hover,.node:focus-visible,.node.on{border-color:var(--ink);background:var(--node-hover);transform:scale(1.25);box-shadow:0 0 0 2px var(--accent);outline:none}
.map.loc .node{opacity:.35}
.map.loc .node.hit{opacity:1;border-color:var(--ink);background:rgba(249,226,175,.5);box-shadow:0 0 0 3px var(--hit),0 0 14px 4px rgba(249,226,175,.75);animation:pulse 1.4s ease-in-out infinite}
.map.loc .node.hit:hover{animation:none;transform:scale(1.3)}
@keyframes pulse{50%{box-shadow:0 0 0 3px var(--hit),0 0 22px 9px rgba(249,226,175,.5)}}
.tip{position:absolute;z-index:7;width:min(320px,80vw);background:var(--panel);color:var(--ink);
  border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px var(--shadow);padding:12px 14px;pointer-events:none}
.tip h3{font-family:var(--display);font-weight:600;font-size:1.05rem;margin:0 0 3px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.72rem;color:var(--muted);margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase}
.kind{border:1px solid var(--line);border-radius:999px;padding:1px 8px}

  // a row shows its map in the pinned tooltip; clicking it again goes back to the drawn map
  fold.querySelectorAll('.fh').forEach(h=>{
    const m=h.parentElement.dataset.mid, toggle=()=>pickMap(pick===m?null:m);
    h.addEventListener('click',e=>{if(!e.target.closest('.web'))toggle()});
    h.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target===h){e.preventDefault();toggle()}});
  });
  const o=fold.querySelector('li.pick');if(o)o.scrollIntoView({block:'nearest'});
  if(!active)hide(); // re-place the pinned tooltip around the resized fold-out
}
// a monster clicked in the pinned tooltip: select it in the sidebar's monster list
function selectMob(n){
  if(tab!=='mobs')setTab('mobs');
  locMob(n);renderList();
  const r=[...$('list').querySelectorAll('.row')].find(x=>x.dataset.m===n);if(r)r.scrollIntoView({block:'nearest'});
}
// a click on empty map clears the selection; the path is checked because re-renders detach the clicked element
map.addEventListener('click',e=>{if(!e.composedPath().some(n=>n===fold||n===tip||n.classList?.contains('node')))closeFold()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeFold()});
addEventListener('resize',()=>{if(openId)renderFold(false)});

// ---- locate ----
function setLoc(next){
  loc=next;
  map.classList.toggle('loc',!!loc);
  // a node lights up when it or any of its hidden maps has a match; the count is every matching map
  // the "+N" chip counts matching hidden maps folded under a node
  nodes.forEach(b=>{
    const id=b.dataset.id,more=loc?(KIDS[id]||[]).filter(m=>matchCount(m)>0).length:0;
    b.classList.toggle('hit',!!loc&&(more>0||matchCount(id)>0));
    if(more)b.dataset.more=more;else delete b.dataset.more;
  });
  hitCount=loc?Object.keys(MOBS).filter(m=>matchCount(m)>0).length:0;
  if(openId)renderFold(false);
  if(next)rankFolded=false;
  pinned=new Set();spotlight(savedMaps);
  renderRank();
  if(active)show(active);else hide();
}

// ---- ranking panel ----
let rankFolded=false, pinned=new Set(), savedMaps=new Set(), hitCount=0;
function toggleSave(mid){
  if(savedMaps.has(mid))savedMaps.delete(mid);else{savedMaps.add(mid);ping(nodeFor(mid))}
  nodes.forEach(n=>n.classList.toggle('saved',groupHas(n.dataset.id,savedMaps)));
  renderBar();
}
const PIN='<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 14.5s-4.5-4.3-4.5-7.8a4.5 4.5 0 0 1 9 0c0 3.5-4.5 7.8-4.5 7.8z"/><circle cx="8" cy="6.6" r="1.6"/></svg>';
function renderBar(){
  const B=$('bar');let h='';
  if(sel.length){
    h+=`<span class="lbl">${hitCount} map${hitCount===1?'':'s'}</span>`;
    h+=sel.map((x,i)=>{
      const pic=x.kind==='mob'?art('spr',D.mobIds[x.key],22):art('ico',items[x.key].icon,20);
      const nm=x.kind==='mob'?x.key:items[x.key].name;
      return `<span class="pill" data-si="${i}">${pic}<span>${esc(nm)}</span><button class="plk" aria-pressed="${x.locked}" title="${x.locked?'Unlock':'Lock to keep selected'}" aria-label="${x.locked?'Unlock':'Lock'} ${esc(nm)}">${LOCKSVG13}</button><button class="x" title="Remove" aria-label="Remove ${esc(nm)}">×</button></span>`;
    }).join('');
    if(sel.length>1)h+=`<button class="clear" id="clearSel">Clear</button>`;
  }
  if(savedMaps.size){
    if(sel.length)h+='<span class="sep"></span>';
    h+=`<span class="lbl">Saved</span>`+[...savedMaps].map(mid=>`<span class="pill spot" data-mid="${mid}" tabindex="0" title="Ping on map">${PIN}<span>${esc(MOBS[mid][0])}</span><button class="x" title="Unsave" aria-label="Unsave ${esc(MOBS[mid][0])}">×</button></span>`).join('');
  }
  B.innerHTML=h;B.hidden=!h;
  B.querySelectorAll('.pill[data-si]').forEach(p=>{
    const x=sel[+p.dataset.si];
    p.querySelector('.plk').onclick=()=>{toggleLock(x.kind,x.key);renderList()};
    p.querySelector('.x').onclick=()=>{sel=sel.filter(y=>y!==x);applySel();renderList()};
  });
  const c=$('clearSel');if(c)c.onclick=()=>{sel=[];applySel();renderList()};
  B.querySelectorAll('.pill.spot').forEach(p=>{
    const mid=p.dataset.mid,b=nodeFor(mid);
    p.addEventListener('mouseenter',()=>{hide();spotlight(new Set([...savedMaps,...pinned,mid]))});
    p.addEventListener('mouseleave',()=>spotlight(new Set([...savedMaps,...pinned])));
    p.addEventListener('click',e=>{
      if(e.target.closest('.x')){toggleSave(mid);spotlight(new Set([...savedMaps,...pinned]));if(loc)renderRank();return}
      ping(b);openFold(rootOf(mid),mid)});
    p.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();ping(b);openFold(rootOf(mid),mid)}});
  });
}
function spotlight(set){
  map.classList.toggle('solo',set.size>0);
  nodes.forEach(n=>n.classList.toggle('focus',groupHas(n.dataset.id,set)));
}
function renderRank(){
  const R=$('rank'), T=$('rankTab');
  renderBar();
  // wide screens keep the panel open (empty until something is picked); narrow screens fold it as a drawer
  const narrow=matchMedia('(max-width:820px)').matches;
  if(!loc){pinned=new Set();spotlight(savedMaps);R.hidden=narrow;T.hidden=true;
    $('rankTitle').textContent='Best maps';$('rankSub').textContent='Pick a monster or item to rank the maps it spawns on.';$('rankList').innerHTML='';return}
  R.hidden=narrow&&rankFolded;T.hidden=!R.hidden;
  const rows=[];
  for(const [mid,[name,mobs]] of Object.entries(MOBS)){
    const total=mobs.reduce((s,m)=>s+m[2],0);
    const who=mobs.filter(m=>loc.mobs.has(m[0]));
    if(!who.length)continue;
    const n=who.reduce((s,m)=>s+m[2],0);
    rows.push({mid,name,n,camp:campCount(mid,who.map(m=>m[0]))||Math.min(n,1),who,lv:lvRange(mobs)});
  }
  rows.sort((a,b)=>b.camp-a.camp||b.n-a.n);
  spotlight(savedMaps);
  const hasItem=loc.items.length>0, isItem=hasItem||sel.length>1;
  const names=sel.map(x=>x.kind==='mob'?x.key:items[x.key].name);
  const what=`<b>${names.map(esc).join('</b>, <b>')}</b>`;
  $('rankTitle').textContent=hasItem?'Best maps to farm':'Best camp spots';
  $('rankSub').innerHTML=hasItem
    ? `Maps with the most spawns of ${sel.every(x=>x.kind==='item')?'monsters that drop':'monsters matching'} ${what}. Ranked by the most of them on one screen, then by total. Drop rates aren't published, so more droppers means more chances.`
    : `Maps ranked by the most ${what} spawns on one screen${sel.length>1?' combined':''}, then by total, so spread-out maps rank lower.`;
  $('rankList').innerHTML=rows.map(r=>`<li tabindex="0" data-mid="${r.mid}">
      <span class="rk-name" title="${esc(r.name)}">${LOCK(savedMaps.has(r.mid),esc(r.name))}<span>${esc(r.name)}<small class="rk-lv">${r.lv} map${HIDDEN[r.mid]?' · hidden':''}</small></span></span>
      <span class="rk-num" title="Most spawns on one screen; total spawns on the map">${r.camp}<small>per screen · x${r.n}</small></span>
      ${isItem?`<span class="rk-who">${r.who.map(([n,lv,c])=>`<span class="m">${art('spr',D.mobIds[n],18)}${esc(n)} x${c}</span>`).join('')}</span>`:''}
    </li>`).join('');
  $('rankList').querySelectorAll('li').forEach(li=>{
    const mid=li.dataset.mid,b=nodeFor(mid);
    li.classList.toggle('pinned',pinned.has(mid));
    const all=()=>new Set([...savedMaps,...pinned]);
    const on=()=>{hide();spotlight(new Set([...all(),mid]))}, off=()=>spotlight(all());
    li.addEventListener('mouseenter',on);li.addEventListener('mouseleave',off);
    li.addEventListener('focus',on);li.addEventListener('blur',off);
    li.addEventListener('click',e=>{
      if(e.target.closest('.lk')){
        e.stopPropagation();
        toggleSave(mid);
        const lk=li.querySelector('.lk'),v=savedMaps.has(mid);lk.setAttribute('aria-pressed',v);lk.title=v?'Unlock':'Lock to keep selected';
        markPins();spotlight(new Set([...all(),mid]));return;
      }
      const same=pinned.has(mid);
      pinned=same?new Set():new Set([mid]);
      markPins();
      if(matchMedia('(max-width:820px)').matches){rankFolded=true;$('rank').hidden=true;$('rankTab').hidden=false}
      spotlight(same&&matchMedia('(hover:hover)').matches?new Set([...all(),mid]):all());
      if(!same){ping(b);openFold(rootOf(mid),mid)}
    });
  });
  markPins();
}
function markPins(){$('rankList').querySelectorAll('li').forEach(x=>x.classList.toggle('pinned',pinned.has(x.dataset.mid)||savedMaps.has(x.dataset.mid)))}
function ping(b){b.classList.remove('ping');void b.offsetWidth;b.classList.add('ping')}
$('foldRank').onclick=()=>{rankFolded=true;renderRank()};
$('rankTab').onclick=()=>{rankFolded=false;renderRank()};
const findSel=(kind,key)=>sel.find(x=>x.kind===kind&&x.key==key);
const isSel=(kind,key)=>!!findSel(kind,key);
function applySel(){
  if(!sel.length)return setLoc(null);
  const mobs=new Set();sel.forEach(x=>x.kind==='mob'?mobs.add(x.key):items[x.key].mobs.forEach(m=>mobs.add(m)));
  const label=sel.length===1?(sel[0].kind==='mob'?sel[0].key:items[sel[0].key].name):`${sel.length} selected`;
  setLoc({mobs,items:sel.filter(x=>x.kind==='item').map(x=>x.key),label});
}
// click: select just this one (locked ones stay); click again to deselect
function toggleSel(kind,key){
  const cur=findSel(kind,key);
  if(cur&&!cur.locked) sel=sel.filter(x=>x!==cur);
  else if(!cur) sel=[...sel.filter(x=>x.locked),{kind,key,locked:false}];
  else sel=sel.filter(x=>x.locked); // clicking a locked one drops the unlocked extras
  applySel();
}
// lock: keep it selected while other clicks come and go
function toggleLock(kind,key){
  const cur=findSel(kind,key);
  if(cur) cur.locked=!cur.locked; else sel=[...sel,{kind,key,locked:true}];
  applySel();
}
const locMob=n=>toggleSel('mob',n), locItem=id=>toggleSel('item',id);

// ---- sidebar ----
const TYPES=['All','Equip','Use','Etc'];
function renderFilters(){
  const f=$('filters'); f.hidden=tab!=='drops';
  f.innerHTML=TYPES.map(t=>`<button class="chip-f" aria-pressed="${t===typeFilter}" data-t="${t}">${t}</button>`).join('');
  f.querySelectorAll('button').forEach(b=>b.onclick=()=>{typeFilter=b.dataset.t;renderFilters();renderList()});
}
function renderList(){
  const L=$('list'), q=query.trim().toLowerCase();
  let html='';
  if(tab==='mobs'){
    const rows=mobNames.filter(n=>!q||n.toLowerCase().includes(q));
    html=rows.map(n=>{
      const on=isSel('mob',n);
      const nm=mobMaps[n].length;
      return `<div class="row${on?' on':''}" role="button" tabindex="0" aria-pressed="${!!on}" data-m="${esc(n)}">${LOCK(!!findSel('mob',n)?.locked,esc(n))}<div class="cell">${art('spr',D.mobIds[n],38)}</div>
        <div class="txt"><div class="nm">${esc(n)}</div><div class="sm">Lv ${mobLevel[n]} · ${nm} map${nm===1?'':'s'}</div></div>
        <a class="web" href="https://meowdb.com/msclassic/monsters/${D.mobIds[n]}" target="_blank" rel="noopener" title="Open on NiaMeowDB" aria-label="${esc(n)} on NiaMeowDB">${GLOBE}</a></div>`;
    }).join('');
  } else {
    const rows=itemList.filter(it=>(typeFilter==='All'||it.type===typeFilter)&&(!q||it.name.toLowerCase().includes(q)||it.mobs.some(m=>m.toLowerCase().includes(q))));
    html=rows.map(it=>{
      const on=isSel('item',it.id);
      const bits=[it.sub||it.type]; if(it.lv)bits.push('Lv '+it.lv); if(it.job)bits.push(it.job);
      return `<div class="row${on?' on':''}" role="button" tabindex="0" aria-pressed="${!!on}" data-i="${it.id}">${LOCK(!!findSel('item',it.id)?.locked,esc(it.name))}<div class="cell">${art('ico',it.icon,32)}</div>
        <div class="txt"><div class="nm">${esc(it.name)}</div><div class="sm">${esc(bits.join(' · '))}</div><div class="sm" title="${esc(it.mobs.join(', '))}">From ${esc(it.mobs.join(', '))}</div></div>
        <a class="web" href="https://meowdb.com/msclassic/item-db/${it.id}" target="_blank" rel="noopener" title="Open on NiaMeowDB" aria-label="${esc(it.name)} on NiaMeowDB">${GLOBE}</a></div>`;
    }).join('');
  }
  L.innerHTML=html||`<p class="empty-l">Nothing matches “${esc(query)}”.</p>`;
  L.querySelectorAll('.row').forEach(b=>{
    const go=()=>{b.dataset.m!=null?locMob(b.dataset.m):locItem(b.dataset.i);renderList();if(loc&&matchMedia('(max-width:820px)').matches)side.dataset.closed='true'};
    b.addEventListener('click',e=>{
      if(e.target.closest('.lk')){e.stopPropagation();b.dataset.m!=null?toggleLock('mob',b.dataset.m):toggleLock('item',b.dataset.i);renderList();return}
      if(!e.target.closest('.web'))go()});
    b.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target===b){e.preventDefault();go()}});
  });
}
function setTab(t){
  tab=t;$('tab-mobs').setAttribute('aria-selected',t==='mobs');$('tab-drops').setAttribute('aria-selected',t==='drops');
  $('q').placeholder=t==='mobs'?'Search monsters':'Search items or monsters';
  $('sub').textContent=t==='mobs'?'Click a monster to light up its maps · click a map for its hidden maps and NiaMeowDB link':'Click an item to light up its maps, then hover a lit node to see which monster drops it';
  renderFilters();renderList();
}
$('tab-mobs').onclick=()=>setTab('mobs');$('tab-drops').onclick=()=>setTab('drops');
$('q').addEventListener('input',e=>{query=e.target.value;renderList()});
const side=$('side');
$('closeSide').onclick=()=>{side.dataset.closed='true'};
$('openSide').onclick=()=>{side.dataset.closed='false'};
if(matchMedia('(max-width:820px)').matches)side.dataset.closed='true';
setTab('mobs');renderRank();
</script>
